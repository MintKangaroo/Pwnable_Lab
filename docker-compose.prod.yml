services:
  backend:
    environment:
      PLAB_ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,nosuid
      - /var/run:size=2m,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  postgres:
    ports: []

  redis:
    ports: []
