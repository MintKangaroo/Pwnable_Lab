[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnable-lab"
version = "1.0.0"
description = "A safe web playground for ELF analysis, exploit payload construction, and pwn challenges."
readme = { text = "Pwnable Lab backend — ELF static analysis, payload tools, and deterministic pwn challenges.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MintKangaroo" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0,<3",
    "capstone>=5.0,<6",
    "pyelftools>=0.31,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["pwnable_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pwnable_lab"]

[tool.coverage.report]
fail_under = 90
show_missing = true
